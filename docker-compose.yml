services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicedesk}
      POSTGRES_USER: ${POSTGRES_USER:-servicedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicedesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: >
      sh -c "python manage.py migrate && python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; host=os.getenv('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0]; req=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':host,'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req)"]
      interval: 30s
      timeout: 5s
      retries: 3
  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "-c", "pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc -f /backups/servicedesk-$$(date +%Y%m%d-%H%M%S).dump"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
